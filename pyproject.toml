[project]
name = "churnvec"
version = "0.1.0"
description = "From-scratch HNSW vector index with churn-aware maintenance (Week 1-5 milestone)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "ChurnVec project" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "psutil>=6.0",
  "pyyaml>=6.0",
  "pydantic>=2.9",
  "scikit-learn>=1.5",
  "hnswlib>=0.8.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.112",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
  "slow: long-running test",
  "dataset: requires downloaded SIFT data",
]

[tool.ruff]
line-length = 100
target-version = "py311"
